$('play').onclick=function(){A.paused?play():pause()};$('restart').onclick=function(){A.pause();A.currentTime=0;S.i=-1;paint(true);$('play').textContent='Mulai Karaoke'};$('next').onclick=function(){if(!S.d)return;var i=Math.min(S.d.timeline.length-1,findIndex(A.currentTime)+1);A.currentTime=S.d.timeline[i].time;S.i=-1;paint(true)};$('seek').onclick=function(e){if(!A.duration)return;var r=this.getBoundingClientRect();A.currentTime=(e.clientX-r.left)/r.width*A.duration;S.i=-1;paint(true)};A.onended=function(){cancelAnimationFrame(S.raf);$('play').textContent='Putar Lagi'};A.onerror=function(){$('play').disabled=true;$('play').textContent='Audio belum tersedia';$('status').textContent='Audio gagal dimuat';$('status').classList.remove('ready')};A.onloadedmetadata=function(){$('play').disabled=false;$('play').textContent='Mulai Karaoke';paint(false)};fetch('data/Cf8BweyPJ8s.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw Error('data '+r.status);return r.json()}).then(function(d){S.d=d;$('title').textContent=d.title;$('artist').textContent=d.artist;$('key').textContent=d.originalKey;$('bpm').textContent=d.analysis.bpm;makeSheet();setIndex(0,false);A.src=d.audio||'audio/Cf8BweyPJ8s.mp3';A.load()}).catch(function(e){$('note').textContent='Data gagal dimuat: '+e.message});})();
