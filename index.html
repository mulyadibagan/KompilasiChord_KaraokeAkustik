<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karaoke Akustik — Kompilasi Chord</title>
<style>
:root{--r:#d20d1b;--d:#111827;--m:#667085;--l:#e4e7ec}*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:var(--d);font:15px/1.5 Arial}.wrap{max-width:920px;margin:auto;padding:24px 14px}.hero{text-align:center}.hero h1{margin:0;font-size:30px}.hero p{margin:4px 0 19px;color:var(--m)}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:21px;box-shadow:0 12px 38px #10182812}.choose{display:block;margin-bottom:16px}.choose select{width:100%;margin-top:5px;padding:11px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font-weight:700}h2{margin:0;font-size:24px}.artist{margin:2px 0 15px;color:var(--m)}audio{display:none}.controls{display:grid;grid-template-columns:1fr 52px 52px;gap:9px}.controls button{height:49px;border:1px solid #d0d5dd;border-radius:11px;background:#fff;font-weight:800;font-size:17px;cursor:pointer}.controls .play{color:#fff;border:0;background:linear-gradient(135deg,#e21624,#a90611)}button:disabled{opacity:.5}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:13px 0}.pill{padding:7px 11px;background:#f7f7f8;border-radius:30px}.ready{color:#087443;background:#ecfdf3}.clock{margin-left:auto}.bar{height:8px;background:#eceef1;border-radius:9px;overflow:hidden;cursor:pointer}.bar span{display:block;width:0;height:100%;background:var(--r)}.now{display:grid;grid-template-columns:1.2fr 1fr;gap:9px;margin:14px 0}.now div{text-align:center;padding:10px;background:#f7f8fa;border:1px solid #eceef1;border-radius:12px;color:var(--m)}.now div:first-child{background:#fff1f2;border-color:#ffcdd1}.now strong{display:block;color:var(--r);font-size:28px}.sheet{height:58vh;min-height:400px;overflow:auto;scroll-behavior:smooth;border:1px solid var(--l);border-radius:14px;padding:18px}pre{margin:0;white-space:pre-wrap;font:600 16px/1.8 ui-monospace,Menlo,Consolas,monospace}.chord{color:var(--r);font-weight:900;border-radius:5px;padding:1px 2px}.chord.active{color:#fff;background:var(--r);box-shadow:0 0 0 3px #d20d1b22}.note{margin-bottom:0;font-size:13px;color:var(--m)}.source a{color:var(--r)}@media(max-width:600px){.wrap{padding:10px 7px}.card{padding:13px}.hero h1{font-size:25px}.clock{width:100%;margin-left:0}.sheet{height:62vh;padding:12px}pre{font-size:15px}}
</style></head><body><main class="wrap"><header class="hero"><h1>Karaoke Akustik</h1><p>Bernyanyi dengan iringan gitar akustik asli</p></header><section class="card"><label class="choose">Pilih lagu<select id="song"></select></label><h2 id="title">Memuat lagu…</h2><p class="artist" id="artist"></p><audio id="backing" preload="metadata"></audio><div class="controls"><button class="play" id="play" disabled>Menyiapkan audio…</button><button id="restart" title="Ulang">↺</button><button id="next" title="Chord berikutnya">›</button></div><div class="meta"><span class="pill">Nada <b id="key">–</b></span><span class="pill"><b id="bpm">–</b> BPM</span><span class="pill ready" id="status">Audio akustik</span><span class="clock"><b id="clock">00:00</b> / <span id="total">00:00</span></span></div><div class="bar" id="seek"><span id="bar"></span></div><div class="now"><div>Chord sekarang<strong id="current">–</strong></div><div>Berikutnya<strong id="upcoming">–</strong></div></div><div class="sheet"><pre id="score"></pre></div><p class="note" id="note">Audio menjadi jam utama; tempo tidak bergantung pada timer browser.</p><p class="note source" id="source"></p></section></main>
<script>
(function(){'use strict';var S={d:null,n:[],i:-1,raf:0,url:null,token:0},$=function(x){return document.getElementById(x)},A=$('backing');function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function isChord(x){return /^([A-G](?:#|b)?)([^\s/]*)/.test(x)}function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}function sheet(){var z=0;$('score').innerHTML=S.d.sheet.split('\n').map(function(line){var a=line.split(/(\s+)/),w=a.filter(function(x){return x.trim()}).length,c=a.filter(function(x){return isChord(x.trim())}).length,is=c&&(w===1||c>=2||c/w>=.6);return is?a.map(function(x){return isChord(x.trim())?'<span class="chord" data-i="'+z+++'">'+esc(x)+'</span>':esc(x)}).join(''):esc(line)}).join('\n');S.n=Array.from(document.querySelectorAll('.chord'))}function index(i,scroll){i=Math.max(0,Math.min(S.d.timeline.length-1,i));if(i===S.i)return;var old=document.querySelector('.active');if(old)old.classList.remove('active');S.i=i;var n=S.n[i];if(n){n.classList.add('active');if(scroll)n.scrollIntoView({behavior:'smooth',block:'center'})}$('current').textContent=S.d.timeline[i].chord;$('upcoming').textContent=S.d.timeline[i+1]?S.d.timeline[i+1].chord:'Selesai'}function find(t){var a=S.d.timeline,l=0,h=a.length-1;while(l<h){var m=Math.ceil((l+h)/2);if(a[m].time<=t)l=m;else h=m-1}return l}function paint(scroll){if(!S.d)return;var t=A.currentTime||0,d=A.duration||S.d.durationSeconds;index(find(t),scroll);$('clock').textContent=fmt(t);$('total').textContent=fmt(d);$('bar').style.width=Math.min(100,t/d*100)+'%'}function loop(){paint(true);if(!A.paused&&!A.ended)S.raf=requestAnimationFrame(loop)}function pause(){A.pause();cancelAnimationFrame(S.raf);paint(false);$('play').textContent='Lanjut'}function source(d){var a=[];if(d.youtubeUrl)a.push('<a href="'+d.youtubeUrl+'" target="_blank" rel="noopener">Sumber audio YouTube</a>');if(d.chordUrl)a.push('<a href="'+d.chordUrl+'" target="_blank" rel="noopener">Sumber chord</a>');$('source').innerHTML=a.length?'Kredit: '+a.join(' · '):''}
function load(path){var token=++S.token;A.pause();A.removeAttribute('src');A.load();$('play').disabled=true;$('play').textContent='Menyiapkan audio…';fetch(path,{cache:'no-cache'}).then(function(r){if(!r.ok)throw Error('data '+r.status);return r.json()}).then(function(d){if(token!==S.token)return;S.d=d;S.i=-1;$('title').textContent=d.title;$('artist').textContent=d.artist;$('key').textContent=d.originalKey;$('bpm').textContent=d.analysis.bpm;sheet();index(0,false);source(d);if(d.driveFileId){A.src='https://drive.usercontent.google.com/download?id='+encodeURIComponent(d.driveFileId)+'&export=download&confirm=t';A.load();return null}return Promise.all(d.audioParts.map(function(url){return fetch(url).then(function(r){if(!r.ok)throw Error('audio '+r.status);return r.arrayBuffer()})}))}).then(function(parts){if(!parts||token!==S.token)return;if(S.url)URL.revokeObjectURL(S.url);S.url=URL.createObjectURL(new Blob(parts,{type:'audio/mpeg'}));A.src=S.url;A.load()}).catch(function(e){$('play').disabled=true;$('play').textContent='Audio gagal dimuat';$('note').textContent='Data/audio gagal dimuat: '+e.message})}
$('play').onclick=function(){if(A.paused)A.play().then(function(){$('play').textContent='Jeda';loop()});else pause()};$('restart').onclick=function(){A.pause();A.currentTime=0;S.i=-1;paint(true);$('play').textContent='Mulai Karaoke'};$('next').onclick=function(){var i=Math.min(S.d.timeline.length-1,find(A.currentTime)+1);A.currentTime=S.d.timeline[i].time;S.i=-1;paint(true)};$('seek').onclick=function(e){if(!A.duration)return;var r=this.getBoundingClientRect();A.currentTime=(e.clientX-r.left)/r.width*A.duration;S.i=-1;paint(true)};A.onloadedmetadata=function(){$('play').disabled=false;$('play').textContent='Mulai Karaoke';paint(false)};A.onended=function(){$('play').textContent='Putar Lagi'};$('song').onchange=function(){load(this.value)};fetch('catalog.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(c){$('song').innerHTML=c.songs.map(function(s){return '<option value="'+s.timeline+'">'+s.artist+' — '+s.title+'</option>'}).join('');var requested=new URLSearchParams(location.search).get('song'),opt=Array.from($('song').options).find(function(o){return o.value.indexOf(requested)>-1});if(opt)$('song').value=opt.value;load($('song').value)}).catch(function(e){$('note').textContent='Katalog gagal dimuat: '+e.message});})();
</script><link rel="stylesheet" href="catalog-ui.css"><script src="catalog-ui.js"></script></body></html>
