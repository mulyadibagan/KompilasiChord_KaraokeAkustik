<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karaoke Akustik — Kompilasi Chord</title><style>
:root{--r:#d20d1b;--d:#111827;--m:#667085;--l:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:var(--d);font:15px/1.5 Arial}.wrap{max-width:900px;margin:auto;padding:25px 14px}.hero{text-align:center}.hero h1{margin:0;font-size:29px}.hero p{margin:3px 0 18px;color:var(--m)}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 12px 38px #10182812}h2{margin:0;font-size:23px}.artist{color:var(--m);margin:2px 0 15px}.controls{display:grid;grid-template-columns:1fr 52px 52px;gap:8px}.controls button{height:47px;border:1px solid #d0d5dd;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.controls .play{color:#fff;border:0;background:linear-gradient(135deg,#e21624,#aa0711)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.pill{padding:7px 11px;background:#f7f7f8;border-radius:30px}.clock{margin-left:auto}.bar{height:7px;background:#eceef1;border-radius:9px;overflow:hidden}.bar span{display:block;width:0;height:100%;background:var(--r)}.now{display:grid;grid-template-columns:1.2fr 1fr;gap:9px;margin:13px 0}.now div{text-align:center;padding:10px;background:#f7f8fa;border:1px solid #eceef1;border-radius:12px;color:var(--m)}.now div:first-child{background:#fff1f2;border-color:#ffcdd1}.now strong{display:block;color:var(--r);font-size:27px}.sheet{height:58vh;min-height:400px;overflow:auto;scroll-behavior:smooth;border:1px solid var(--l);border-radius:14px;padding:18px}pre{margin:0;white-space:pre-wrap;font:600 16px/1.8 ui-monospace,Menlo,Consolas,monospace}.chord{color:var(--r);font-weight:900;border-radius:5px;padding:1px 2px}.chord.active{color:#fff;background:var(--r);box-shadow:0 0 0 3px #d20d1b22}.note{font-size:13px;color:var(--m)}@media(max-width:600px){.wrap{padding:10px 7px}.card{padding:12px}.hero h1{font-size:24px}.clock{margin-left:0}.sheet{height:62vh;padding:12px}pre{font-size:15px}}
</style></head><body><main class="wrap"><header class="hero"><h1>Karaoke Akustik</h1><p>Bernyanyi dengan petikan gitar Kompilasi Chord</p></header><section class="card"><h2 id="title">Memuat Mangu…</h2><p class="artist" id="artist"></p><div class="controls"><button class="play" id="play">Mulai Karaoke</button><button id="restart">↺</button><button id="next">›</button></div><div class="meta"><span class="pill">Nada <b id="key">–</b></span><span class="pill"><b id="bpm">–</b> BPM</span><span class="pill">Experimental</span><span class="clock"><b id="clock">00:00</b> / <span id="total">00:00</span></span></div><div class="bar"><span id="bar"></span></div><div class="now"><div>Chord sekarang<strong id="current">–</strong></div><div>Berikutnya<strong id="upcoming">–</strong></div></div><div class="sheet"><pre id="score"></pre></div><p class="note" id="note">Suara gitar memakai sampel Acoustic Guitar Steel (CC BY 3.0).</p></section></main><script>window.MIDI={Soundfont:{}};</script><script src="https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_guitar_steel-mp3.js"></script><script>
(function(){'use strict';var S={d:null,n:[],i:0,on:false,start:0,elapsed:0,raf:0,pt:0,voices:[]},$=function(x){return document.getElementById(x)},N={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11},NN=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];function fmt(s){s=Math.max(0,s|0);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function chord(x){var m=x.match(/^([A-G](?:#|b)?)([^\s/]*)/);return m?{r:m[1],s:m[2]||''}:null}function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function notes(x){var c=chord(x),r=N[c.r],mi=/^m(?!aj)/.test(c.s),t=mi?3:4,base=40+((r-4+12)%12);if(base>50)base-=12;return[base,base+7,base+12,base+12+t,base+19]}function mn(m){return NN[m%12]+(Math.floor(m/12)-1)}function stopVoices(){S.voices.forEach(function(a){a.volume=0;a.pause();a.currentTime=0});S.voices=[]}function string(m,v){var bank=MIDI.Soundfont.acoustic_guitar_steel,uri=bank&&bank[mn(m)];if(!uri){$('note').textContent='Sampel '+mn(m)+' tidak tersedia.';return}var a=new Audio(uri);a.volume=Math.min(1,v);S.voices.push(a);if(S.voices.length>10){var old=S.voices.shift();old.volume=0;old.pause()}a.play().catch(function(e){$('note').textContent='Audio diblokir browser. Tekan Mulai sekali lagi.'})}function pick(){clearTimeout(S.pt);if(!S.on)return;var p=notes(S.d.timeline[S.i].chord),a=[0,2,3,2,1,2,4,3],k=0,ms=30000/S.d.analysis.bpm;(function go(){if(!S.on)return;string(p[a[k++%8]],k%8===1?.7:.5);S.pt=setTimeout(go,ms)})()}
function sheet(){var z=0;$('score').innerHTML=S.d.sheet.split('\n').map(function(line){var a=line.split(/(\s+)/),words=a.filter(function(x){return x.trim()}).length,cs=a.filter(function(x){return chord(x.trim())}).length,is=cs&&(words===1||cs>=2||cs/words>=.6);return is?a.map(function(x){return chord(x.trim())?'<span class="chord" data-i="'+z+++'">'+esc(x)+'</span>':esc(x)}).join(''):esc(line)}).join('\n');S.n=[].slice.call(document.querySelectorAll('.chord'))}function index(i,scroll){if(S.on)stopVoices();S.i=Math.max(0,Math.min(S.d.timeline.length-1,i));document.querySelectorAll('.active').forEach(function(x){x.classList.remove('active')});var n=S.n[S.i];if(n){n.classList.add('active');if(scroll)n.scrollIntoView({behavior:'smooth',block:'center'})}$('current').textContent=S.d.timeline[S.i].chord;$('upcoming').textContent=S.d.timeline[S.i+1]?S.d.timeline[S.i+1].chord:'Selesai';if(S.on)pick()}function tick(){if(!S.on)return;var t=S.elapsed+(performance.now()-S.start)/1000;if(t>=S.d.durationSeconds){pause();return}while(S.i+1<S.d.timeline.length&&t>=S.d.timeline[S.i+1].time)index(S.i+1,true);$('clock').textContent=fmt(t);$('bar').style.width=t/S.d.durationSeconds*100+'%';S.raf=requestAnimationFrame(tick)}function play(){S.on=true;S.start=performance.now();$('play').textContent='Jeda';pick();tick()}function pause(){if(S.on)S.elapsed+=(performance.now()-S.start)/1000;S.on=false;cancelAnimationFrame(S.raf);clearTimeout(S.pt);stopVoices();$('play').textContent='Lanjut'}function restart(){pause();S.elapsed=0;index(0,true);$('clock').textContent='00:00';$('bar').style.width=0;$('play').textContent='Mulai Karaoke'}
$('play').onclick=function(){S.on?pause():play()};$('restart').onclick=restart;$('next').onclick=function(){pause();index(S.i+1,true);S.elapsed=S.d.timeline[S.i].time;$('clock').textContent=fmt(S.elapsed)};fetch('data/JENpTmMQBQY.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){S.d=d;$('title').textContent=d.title;$('artist').textContent=d.artist;$('key').textContent=d.originalKey;$('bpm').textContent=d.analysis.bpm;$('total').textContent=fmt(d.durationSeconds);sheet();index(0,false)}).catch(function(e){$('note').textContent='Data gagal dimuat: '+e.message});})();
</script></body></html>
