<script>
(function(){'use strict';
  var D=window.KC_PETERPAN_TRANSCRIPTION,state={tick:0,running:false,track:'rhythm',token:0,timer:0,lastBar:-1},ctx,master,room,delay;
  var bars=document.getElementById('bars'),play=document.getElementById('play'),seek=document.getElementById('seek'),tempo=document.getElementById('tempo');
  function midiName(m){return['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m%12]+(Math.floor(m/12)-1)}
  function freq(m){return 440*Math.pow(2,(m-69)/12)}
  function engine(){if(ctx)return ctx;ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});master=ctx.createGain();master.gain.value=.82;var comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=18;comp.ratio.value=3;comp.attack.value=.004;comp.release.value=.2;room=ctx.createGain();room.gain.value=.22;delay=ctx.createDelay(.5);delay.delayTime.value=.115;var fb=ctx.createGain();fb.gain.value=.23;delay.connect(fb);fb.connect(delay);delay.connect(room);room.connect(comp);master.connect(comp);comp.connect(ctx.destination);return ctx}
  function pluck(m,d,v,kind,when){var c=engine(),sampleDur=Math.max(.09,d),sampleVol=(kind==='lead'?Number(leadVol.value):Number(rhythmVol.value))/100*v*.28,sampleOffset=Math.max(.002,when-c.currentTime);if(window.KCSampler&&KCSampler.playNote(c,kind==='lead'?'guitar':'acoustic',midiName(m),sampleDur,sampleVol,sampleOffset,{profile:kind==='lead'?'lead':'acoustic',style:kind==='lead'?'lead':'rhythm',pan:kind==='lead'?.2:-.18,room:Number(roomVol.value)/100*.65,delay:kind==='lead'?.12:.035,humanize:true}))return;var gain=c.createGain(),filter=c.createBiquadFilter(),o1=c.createOscillator(),o2=c.createOscillator(),noise=c.createBufferSource(),ng=c.createGain(),pan=c.createStereoPanner();var dur=Math.max(.09,d);o1.type=kind==='lead'?'triangle':'sine';o2.type='triangle';o1.frequency.value=freq(m);o2.frequency.value=freq(m)*1.003;filter.type='lowpass';filter.frequency.setValueAtTime(kind==='lead'?4200:2600,when);filter.frequency.exponentialRampToValueAtTime(850,when+Math.min(.45,dur));filter.Q.value=.7;var vol=(kind==='lead'?Number(leadVol.value):Number(rhythmVol.value))/100*v*.2;gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(Math.max(.001,vol),when+.008);gain.gain.exponentialRampToValueAtTime(.0001,when+dur);pan.pan.value=kind==='lead'?.2:-.18;var buffer=c.createBuffer(1,Math.floor(c.sampleRate*.025),c.sampleRate),data=buffer.getChannelData(0);for(var i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);noise.buffer=buffer;ng.gain.value=kind==='lead'?.025:.04;o1.connect(filter);o2.connect(filter);noise.connect(ng);ng.connect(filter);filter.connect(gain);gain.connect(pan);pan.connect(master);pan.connect(delay);o1.start(when);o2.start(when);noise.start(when);o1.stop(when+dur+.03);o2.stop(when+dur+.03);noise.stop(when+.03)}
  function events(kind,bar){return D[kind][bar]||[]}
  function activeEvent(kind,bar,slot){return events(kind,bar).find(function(e){return slot>=e[0]&&slot<e[0]+e[1]})}
  function tab(kind,bar){var names=['e','B','G','D','A','E'],grid=names.map(function(){return Array(16).fill('--')});events(kind,bar).forEach(function(e){var s=5-e[3],f=e[4];if(s<0||s>5)return;grid[s][e[0]]='<span class="note" data-slot="'+e[0]+'">'+String(f).padStart(2,'-')+'</span>';for(var i=1;i<e[1]&&e[0]+i<16;i++)grid[s][e[0]+i]='<span class="hold" data-slot="'+(e[0]+i)+'">~~</span>'});return names.map(function(n,i){var out='';for(var x=0;x<16;x++){if(x%4===0)out+='|';out+=grid[i][x]}return n+'  '+out+'|'}).join('\n')}
  function render(){bars.innerHTML=D.chords.map(function(chord,i){return'<article class="bar" data-bar="'+i+'"><div class="bar-label"><strong>'+chord+'</strong><span>'+D.barSections[i]+' · '+(i+1)+'</span></div><pre>'+tab(state.track,i)+'</pre></article>'}).join('');document.getElementById('scoreTitle').textContent=(state.track==='rhythm'?'Gitar Rhythm':'Gitar Lead')+' · Full Lagu';highlight()}
  function highlight(){var bar=Math.min(77,Math.floor(state.tick/16)),slot=state.tick%16;document.querySelectorAll('.now').forEach(function(e){e.classList.remove('now')});document.querySelectorAll('.bar').forEach(function(e){var on=Number(e.dataset.bar)===bar;e.classList.toggle('active',on);if(on)e.style.setProperty('--cursor',(2+slot*6)+'%')});var card=document.querySelector('.bar[data-bar="'+bar+'"]');if(card){card.querySelectorAll('[data-slot="'+slot+'"]').forEach(function(e){e.classList.add('now')});if(state.running&&state.lastBar!==bar)card.scrollIntoView({behavior:'smooth',block:'center'})}state.lastBar=bar;var ev=activeEvent(state.track,bar,slot);document.getElementById('noteText').textContent=ev?'Nada '+midiName(ev[2])+' · Senar '+(6-ev[3])+' · Fret '+ev[4]:'Diam · '+D.barSections[bar];document.getElementById('position').textContent='Birama '+(bar+1)+'/78 · 1/16 '+(slot+1);seek.value=state.tick;document.getElementById('time').textContent=format(state.tick*60/Number(tempo.value)/4)+' / '+format(78*4*60/Number(tempo.value))}
  function format(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
  function step(token){if(!state.running||token!==state.token)return;var c=engine(),b=Math.floor(state.tick/16),s=state.tick%16,sec=60/Number(tempo.value)/4,when=c.currentTime+.035;['rhythm','lead'].forEach(function(k){events(k,b).filter(function(e){return e[0]===s}).forEach(function(e){pluck(e[2],e[1]*sec,e[5],k,when)})});highlight();state.tick++;if(state.tick>=1248){stopAll();return}state.timer=setTimeout(function(){step(token)},sec*1000)}
  function start(){if(state.running)return;var c=engine();c.resume();room.gain.value=Number(roomVol.value)/100;state.running=true;state.token++;var token=state.token,launch=function(){if(!state.running||token!==state.token)return;play.textContent='❚❚ Jeda';document.getElementById('status').textContent='Memutar sampel gitar natural · tanpa vokal';step(token)};if(window.KCSampler&&!KCSampler.status(['acoustic','guitar']).loaded){play.textContent='Memuat…';document.getElementById('status').textContent='Memuat bank sampel gitar dari Cloudflare…';KCSampler.load(c,['acoustic','guitar']).then(launch).catch(launch)}else launch()}
  function pause(){state.running=false;state.token++;clearTimeout(state.timer);play.textContent='▶ Lanjut'}
  function stopAll(){pause();state.tick=0;state.lastBar=-1;play.textContent='▶ Putar';highlight()}
  play.onclick=function(){state.running?pause():start()};document.getElementById('stop').onclick=stopAll;document.getElementById('rewind').onclick=function(){state.tick=0;state.lastBar=-1;highlight()};seek.oninput=function(){state.tick=Number(this.value);state.lastBar=-1;highlight()};tempo.oninput=function(){document.getElementById('bpm').textContent=this.value};document.querySelector('.tracks').onclick=function(e){var b=e.target.closest('[data-track]');if(!b)return;state.track=b.dataset.track;this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))});render()};document.getElementById('sections').onclick=function(e){var b=e.target.closest('[data-bar]');if(!b)return;state.tick=Number(b.dataset.bar)*16;state.lastBar=-1;this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});highlight()};render();
})();
</script>
