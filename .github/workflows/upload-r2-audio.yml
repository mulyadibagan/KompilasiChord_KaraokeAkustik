name: Upload karaoke audio to R2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio/*.part'
      - '.github/workflows/upload-r2-audio.yml'

permissions:
  contents: read

concurrency:
  group: r2-karaoke-audio
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify R2 configuration
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Upload final audio parts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          shopt -s nullglob
          files=(audio/*.part)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No final audio parts found in audio/." >&2
            exit 1
          fi

          aws s3 cp audio/ "s3://${R2_BUCKET_NAME}/audio/" \
            --recursive \
            --exclude "*" \
            --include "*.part" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "audio/mpeg" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

          echo "Uploaded ${#files[@]} final audio part(s) to R2."
