name: Publish guitar samples to Cloudflare R2on:  workflow_dispatch:  push:    paths:      - ".github/workflows/publish-guitar-samples-r2.yml"permissions:  contents: readjobs:  publish:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - uses: actions/setup-python@v5        with:          python-version: "3.12"      - name: Install R2 client        run: python -m pip install --disable-pip-version-check boto3      - name: Upload CC0 guitar banks        env:          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}        run: |          python - <<'PY'          import os          from pathlib import Path          import boto3          required = ("R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY")          missing = [name for name in required if not os.environ.get(name)]          if missing:              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))
