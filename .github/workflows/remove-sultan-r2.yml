name: Remove Sultan audio from R2

on:
  push:
    paths:
      - ".github/workflows/remove-sultan-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3

      - name: Delete Terpaksa Aku Lakukan objects
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python - <<'PY'
          import os
          import boto3

          required = [
              "R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY", "R2_BUCKET_NAME",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))

          prefix = "sultan/terpaksa-aku-lakukan/"
          client = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )
          bucket = os.environ["R2_BUCKET_NAME"]
          paginator = client.get_paginator("list_objects_v2")
          keys = [
              item["Key"]
              for page in paginator.paginate(Bucket=bucket, Prefix=prefix)
              for item in page.get("Contents", [])
          ]
          if keys:
              for start in range(0, len(keys), 1000):
                  batch = keys[start:start + 1000]
                  client.delete_objects(
                      Bucket=bucket,
                      Delete={"Objects": [{"Key": key} for key in batch], "Quiet": True},
                  )
          remaining = [
              item["Key"]
              for page in paginator.paginate(Bucket=bucket, Prefix=prefix)
              for item in page.get("Contents", [])
          ]
          if remaining:
              raise SystemExit("R2 objects still present: " + ", ".join(remaining))
          print(f"Removed {len(keys)} object(s) under {prefix}")
          PY
