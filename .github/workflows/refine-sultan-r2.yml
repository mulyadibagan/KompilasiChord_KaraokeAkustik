name: Refine Sultan vocals and publish candidate to R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refine-sultan-r2
  cancel-in-progress: false

jobs:
  refine-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_URL: https://pub-f24c157419c64a00886e77e672bff365.r2.dev/sultan/terpaksa-aku-lakukan/full-band-clean-v2.mp3?v=sultan-karaoke-2
      OUTPUT_KEY: sultan/terpaksa-aku-lakukan/full-band-demucs-v3.mp3
      MANIFEST_KEY: sultan/terpaksa-aku-lakukan/manifest-v3.json
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Demucs and R2 client
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.0.1 torchaudio==2.0.2 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/facebookresearch/demucs#egg=demucs" boto3

      - name: Download current R2 master
        run: |
          curl --fail --location --retry 3 "$SOURCE_URL" --output "$RUNNER_TEMP/sultan-v2.mp3"
          test -s "$RUNNER_TEMP/sultan-v2.mp3"
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/sultan-v2.mp3"

      - name: Remove residual vocals
        run: |
          python -m demucs \
            --two-stems=vocals \
            -n htdemucs \
            --mp3 \
            --mp3-bitrate 192 \
            -o "$RUNNER_TEMP/separated" \
            "$RUNNER_TEMP/sultan-v2.mp3"
          cp "$RUNNER_TEMP/separated/htdemucs/sultan-v2/no_vocals.mp3" \
            "$RUNNER_TEMP/full-band-demucs-v3.mp3"

      - name: Validate candidate timing and format
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "sultan-v2.mp3"
          output = Path(os.environ["RUNNER_TEMP"]) / "full-band-demucs-v3.mp3"

          def probe(path):
              raw = subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries",
                  "format=duration:stream=sample_rate,channels,codec_name",
                  "-of", "json", str(path),
              ], text=True)
              return json.loads(raw)

          src = probe(source)
          out = probe(output)
          src_duration = float(src["format"]["duration"])
          out_duration = float(out["format"]["duration"])
          stream = out["streams"][0]

          if abs(src_duration - out_duration) > 0.08:
              raise SystemExit(
                  f"Duration drift too large: source={src_duration}, output={out_duration}"
              )
          if int(stream["sample_rate"]) != 44100 or int(stream["channels"]) != 2:
              raise SystemExit(f"Unexpected output format: {stream}")
          if output.stat().st_size < 5_000_000:
              raise SystemExit("Candidate is unexpectedly small")

          manifest = {
              "title": "Sultan – Terpaksa Aku Lakukan · Karaoke HQ",
              "kind": "full",
              "duration": out_duration,
              "bpm": 125.0,
              "startOffset": 1.590567,
              "bars": 158,
              "meter": "4/4",
              "sampleRate": 44100,
              "channels": 2,
              "codec": "MP3 192 kbps",
              "vocal": False,
              "source": "R2 v2 master refined with Demucs two-stem vocal separation",
              "sourceObject": "sultan/terpaksa-aku-lakukan/full-band-clean-v2.mp3",
              "r2ObjectKey": os.environ["OUTPUT_KEY"],
              "renderVersion": "sultan-karaoke-3",
              "validation": {
                  "durationDriftSeconds": round(out_duration - src_duration, 6),
                  "timingRetained": True,
              },
          }
          manifest_path = Path(os.environ["RUNNER_TEMP"]) / "manifest-v3.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload versioned candidate to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import boto3

          required = [
              "R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY", "R2_BUCKET_NAME",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))

          client = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )
          temp = Path(os.environ["RUNNER_TEMP"])
          objects = [
              (
                  temp / "full-band-demucs-v3.mp3",
                  os.environ["OUTPUT_KEY"],
                  "audio/mpeg",
                  "public, max-age=31536000, immutable",
              ),
              (
                  temp / "manifest-v3.json",
                  os.environ["MANIFEST_KEY"],
                  "application/json",
                  "public, max-age=300",
              ),
          ]
          for path, key, content_type, cache_control in objects:
              client.upload_file(
                  str(path),
                  os.environ["R2_BUCKET_NAME"],
                  key,
                  ExtraArgs={
                      "ContentType": content_type,
                      "CacheControl": cache_control,
                  },
              )
              head = client.head_object(
                  Bucket=os.environ["R2_BUCKET_NAME"], Key=key
              )
              if head["ContentLength"] != path.stat().st_size:
                  raise SystemExit(f"R2 size mismatch for {key}")
              print(f"Uploaded {key} ({head['ContentLength']} bytes)")
          PY

      - name: Verify public R2 candidate
        run: |
          curl --fail --silent --show-error --range 0-1023 \
            "https://pub-f24c157419c64a00886e77e672bff365.r2.dev/$OUTPUT_KEY" \
            --output /dev/null
          curl --fail --silent --show-error \
            "https://pub-f24c157419c64a00886e77e672bff365.r2.dev/$MANIFEST_KEY" \
            --output /dev/null
          echo "Sultan v3 candidate is available from Cloudflare R2."
