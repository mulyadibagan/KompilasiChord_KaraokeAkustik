name: Publish corrected Sultan audio to Cloudflare R2

on:
  push:
    branches:
      - agent/fix-sultan-karaoke-mp3
    paths:
      - ".github/workflows/publish-sultan-r2.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AUDIO_SHA256: 69f7cd78dba071ede13adfd6ce825ed3b568f3be63d126baba080a1fcec88395
      AUDIO_SIZE: "7308269"
      BLOB_SHAS: >-
        b905b31755151440410da11a47a0fba83e129a66
        599cb240e04fb21df83e6e259707e085cd97fce4
        e40f7f8b7dd8165084ea7ef57ef64a23e46cf994
        a14856ecc07479c08cef61dc5f3ce70bc62b87e0
        f0124169a8f2156e9f36e41627959f8ba64655ee
        e11d426e6126c6b9a6fdd1b501435302476c2908
        21fc5b886d84ba7d2f586c7f97748b0c57049bdc
        a48ceb0ab056275f451a5b30ad121d486528cdf4
        8f9cbc2d6ca72fae1360c8603fc48f57ca716709
        310c5e4ee96a95e80538248ed0c610dc00c24241
        0b75251216d4aa0db5ec231e5eaec35e70d7c7a7
        5e2d267f1e087263d5f755e0b21bd975942fcebc
        73081b8ee2cf642157353df9cc792bc96236d9dd
        0c2f995a790c48b8279e0d9154101cb6ca460b3e
    steps:
      - uses: actions/checkout@v7

      - name: Reconstruct verified temporary transfer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          destination = Path(os.environ["RUNNER_TEMP_DIR"]) / "full-band-clean-v2.mp3"
          with destination.open("wb") as output:
              for sha in os.environ["BLOB_SHAS"].split():
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/git/blobs/{sha}",
                      headers={
                          "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request) as response:
                      payload = json.load(response)
                  output.write(base64.b64decode(payload["content"]))

          digest = hashlib.sha256(destination.read_bytes()).hexdigest()
          if digest != os.environ["AUDIO_SHA256"]:
              raise SystemExit(f"Audio checksum mismatch: {digest}")
          if destination.stat().st_size != int(os.environ["AUDIO_SIZE"]):
              raise SystemExit("Audio size mismatch")
          print(f"Verified temporary transfer: {destination.stat().st_size} bytes")
          PY

      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3

      - name: Upload versioned audio and manifest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import boto3

          required = ("R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))

          bucket = "kompilasichord-audio"
          audio = Path(os.environ["RUNNER_TEMP_DIR"]) / "full-band-clean-v2.mp3"
          manifest = Path("audio/sultan-karaoke-hq/manifest.json")
          objects = [
              (audio, "sultan/terpaksa-aku-lakukan/full-band-clean-v2.mp3", "audio/mpeg"),
              (manifest, "sultan/terpaksa-aku-lakukan/manifest-v2.json", "application/json"),
          ]
          client = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )
          for path, key, content_type in objects:
              client.upload_file(
                  str(path),
                  bucket,
                  key,
                  ExtraArgs={
                      "ContentType": content_type,
                      "CacheControl": (
                          "public, max-age=31536000, immutable"
                          if path.suffix == ".mp3"
                          else "public, max-age=300"
                      ),
                  },
              )
              head = client.head_object(Bucket=bucket, Key=key)
              if head["ContentLength"] != path.stat().st_size:
                  raise SystemExit(f"R2 size mismatch for {key}")
              print(f"Uploaded {key} ({head['ContentLength']} bytes)")
          PY

      - name: Verify public R2 streaming
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --range 0-1023 \
            "https://pub-f24c157419c64a00886e77e672bff365.r2.dev/sultan/terpaksa-aku-lakukan/full-band-clean-v2.mp3?v=sultan-karaoke-2" \
            --output /dev/null
          curl --fail --silent --show-error \
            "https://pub-f24c157419c64a00886e77e672bff365.r2.dev/sultan/terpaksa-aku-lakukan/manifest-v2.json" \
            --output /dev/null
          echo "Corrected Sultan R2 streaming verified."
